<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{tool_name}} — Hero</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1200px; height:627px; overflow:hidden; }
body {
  font-family:'Inter', sans-serif; background:#dceaf3;
  display:flex; flex-direction:column; padding:64px 80px;
  position:relative; overflow:hidden;
}
.bg-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.vignette {
  position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.0) 55%, rgba(0,0,0,0.10) 100%);
  z-index:1;
}
.stack { z-index:2; position:relative; display:flex; flex-direction:column; gap:18px; height:100%; max-width:980px; }
.kicker {
  font-size:18px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
  color:#1A1A1A; opacity:0.78; text-shadow: 0 1px 2px rgba(255,255,255,0.55);
}
.punchy {
  font-size:84px; font-weight:800; line-height:1.02; letter-spacing:-2px;
  color:#0A0A0A; text-shadow: 0 2px 14px rgba(255,255,255,0.45); max-width:920px;
}
.subtitle {
  font-size:26px; font-weight:500; line-height:1.4; max-width:780px;
  color:#1A1A1A; opacity:0.85; text-shadow: 0 1px 4px rgba(255,255,255,0.4); margin-top:8px;
}
.spacer { flex:1; }
.ctas { display:flex; gap:16px; align-items:center; }
.cta {
  padding:14px 28px; border:2px solid rgba(10,10,10,0.85); border-radius:999px;
  font-size:18px; font-weight:700; letter-spacing:0.5px;
  color:#0A0A0A; background:rgba(255,255,255,0.55); backdrop-filter: blur(4px);
}
.cta.primary { background:#0A0A0A; color:#FFFFFF; border-color:#0A0A0A; }
.watermark {
  position:absolute; right:80px; bottom:32px;
  font-size:14px; font-weight:600; letter-spacing:1.5px;
  color:#1A1A1A; opacity:0.58; text-shadow: 0 1px 2px rgba(255,255,255,0.4); z-index:2;
}
</style>
</head>
<body>
  <img src="{{background_filename}}" alt="" class="bg-photo">
  <div class="vignette"></div>
  <div class="stack">
    <div class="kicker">{{tool_name}}</div>
    <h1 class="punchy">{{punchy_line}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    <div class="spacer"></div>
    <div class="ctas">
      <div class="cta primary">{{cta_1}}</div>
      <div class="cta">{{cta_2}}</div>
    </div>
  </div>
  <div class="watermark">everpaula.github.io/marketplace-ops-toolkit</div>
</body>
</html>
